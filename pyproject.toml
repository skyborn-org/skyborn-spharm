[build-system]
requires = [
    "setuptools>=61.0",
    "wheel",
    "numpy>=1.24.0",
    "meson",
    "ninja",
]
build-backend = "setuptools.build_meta"

[project]
name = "skyborn-spharm"
dynamic = ["version"]
description = "Modern Fortran-accelerated spherical harmonic transforms for Python (SPHEREPACK + reduced Gaussian grids)"
readme = "README.md"
authors = [{ name = "Qianye Su", email = "suqianye2000@gmail.com" }]
license = "BSD-3-Clause"
license-files = ["LICENSE", "LICENSE.spherepack"]
requires-python = ">=3.9"
keywords = [
    "atmospheric-science",
    "meteorology",
    "spherical-harmonics",
    "spherepack",
    "gaussian-grid",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "matplotlib",
    "pandas",
    "xarray",
]

[project.urls]
"Homepage" = "https://github.com/skyborn-org/skyborn-spharm"
"Repository" = "https://github.com/skyborn-org/skyborn-spharm"
"Documentation" = "https://skyborn.readthedocs.io/"
"Bug Tracker" = "https://github.com/skyborn-org/skyborn-spharm/issues"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
exclude = [
    "*.build*",
    "*.build*.*",
    "*.build",
    "*.build.*",
]

[tool.setuptools.exclude-package-data]
"*" = [
    "*.pyc",
    "*.pyo",
    "__pycache__/*",
    "build/*",
    "build_local/*",
    "meson-private/*",
    "meson-logs/*",
    "meson-info/*",
]

[tool.setuptools.dynamic]
version = { attr = "skybornspharm.__version__" }

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311", "py312", "py313", "py314"]

[tool.isort]
profile = "black"
line_length = 88
src_paths = ["src", "tests"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

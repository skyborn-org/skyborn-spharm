name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Build & Test (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Install Fortran compiler (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libgomp1 pkg-config

      - name: Install Fortran compiler (macOS)
        if: runner.os == 'macOS'
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew list gcc >/dev/null 2>&1 || brew install gcc
          GCC_BIN_DIR="$(brew --prefix gcc)/bin"
          echo "${GCC_BIN_DIR}" >> "$GITHUB_PATH"
          echo "CC=$(compgen -G "${GCC_BIN_DIR}/gcc-[0-9]*" | sort -V | tail -1)" >> "$GITHUB_ENV"
          echo "FC=$(compgen -G "${GCC_BIN_DIR}/gfortran-[0-9]*" | sort -V | tail -1)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies and build
        run: |
          python -m pip install --upgrade pip setuptools wheel meson ninja numpy
          pip install --no-build-isolation -e ".[dev]"

      - name: Run pytest
        run: pytest -o addopts= -p no:cacheprovider -q

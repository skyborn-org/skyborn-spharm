name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Build & Test (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        python-version: ["3.10", "3.12", "3.15"]

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Rust unit tests
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: cargo test --release --manifest-path rust/spharm-core/Cargo.toml

      - name: Install dependencies and build
        run: |
          python -m pip install --upgrade pip maturin numpy pytest matplotlib pandas xarray
          pip install --no-build-isolation --no-compile -e .

      - name: Run pytest
        run: python -B -m pytest -o addopts= -p no:cacheprovider -q

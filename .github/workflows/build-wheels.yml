name: Build and publish wheels

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_wheels:
    name: Build wheel ${{ matrix.python }}-${{ matrix.buildplat[1] }}
    runs-on: ${{ matrix.buildplat[0] }}
    strategy:
      fail-fast: false
      matrix:
        buildplat:
          - [ubuntu-latest, manylinux_x86_64]
          - [macos-15-intel, macosx_x86_64]
          - [macos-15, macosx_arm64]
          - [windows-2022, win_amd64]
        python: ["cp39", "cp310", "cp311", "cp312", "cp313", "cp314", "cp315"]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust toolchain (macOS / Windows)
        if: matrix.buildplat[1] != 'manylinux_x86_64'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.buildplat[1] == 'macosx_x86_64' && 'x86_64-apple-darwin' || '' }}

      - name: Build wheels (Windows)
        if: matrix.buildplat[1] == 'win_amd64'
        uses: pypa/cibuildwheel@v4.3.5
        with:
          output-dir: wheelhouse
        env:
          CIBW_BUILD: ${{ matrix.python }}-${{ matrix.buildplat[1] }}
          CIBW_SKIP: "*-win32 *-musllinux*"
          CIBW_TEST_COMMAND: python -B -c "from skybornspharm import Spharmt, ReducedGaussianSpharmt, SpharmTransform, invlap; print('skyborn-spharm ok')"

      - name: Build wheels (macOS)
        if: startsWith(matrix.buildplat[1], 'macosx')
        uses: pypa/cibuildwheel@v4.3.5
        with:
          output-dir: wheelhouse
        env:
          CIBW_BUILD: ${{ matrix.python }}-${{ matrix.buildplat[1] }}
          CIBW_SKIP: "*-win32 *-musllinux*"
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET="11.0"
          CIBW_TEST_COMMAND: python -B -c "from skybornspharm import Spharmt, ReducedGaussianSpharmt, SpharmTransform, invlap; print('skyborn-spharm ok')"

      - name: Build wheels (Linux manylinux_2_28)
        if: matrix.buildplat[1] == 'manylinux_x86_64'
        uses: pypa/cibuildwheel@v4.3.5
        with:
          output-dir: wheelhouse
        env:
          CIBW_BUILD: ${{ matrix.python }}-${{ matrix.buildplat[1] }}
          CIBW_SKIP: "*-win32 *-musllinux*"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_LINUX: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          CIBW_ENVIRONMENT_LINUX: PATH="/root/.cargo/bin:$PATH"
          CIBW_TEST_COMMAND: python -B -c "from skybornspharm import Spharmt, ReducedGaussianSpharmt, SpharmTransform, invlap; print('skyborn-spharm ok')"

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.python }}-${{ matrix.buildplat[1] }}
          path: ./wheelhouse/*.whl

  build_sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip build
          python -m build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'release' && github.event.action == 'published')
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: "wheel-*"
          path: dist-artifacts/wheels
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist-artifacts/sdist
          merge-multiple: true
      - name: Prepare dist
        run: |
          set -euo pipefail
          mkdir -p dist pypi-dist
          find dist-artifacts -type f \( -name "*.whl" -o -name "*.tar.gz" \) -exec cp {} dist/ \;
          find dist -maxdepth 1 -type f \( -name "*.whl" -o -name "*.tar.gz" \) -exec cp {} pypi-dist/ \;
          wheel_count="$(find pypi-dist -type f -name '*.whl' | wc -l)"
          sdist_count="$(find pypi-dist -type f -name '*.tar.gz' | wc -l)"
          echo "Prepared ${wheel_count} wheels and ${sdist_count} sdist(s)"
          test "$wheel_count" -gt 0
          test "$sdist_count" -gt 0
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: dist/*
          overwrite_files: true
          generate_release_notes: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi-dist
          skip-existing: true
